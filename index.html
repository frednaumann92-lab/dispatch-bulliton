<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Southeast Communications 911</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: Arial, sans-serif;
  background-color: #1c1c1c;
  color: #f0f0f0;
  display: flex;
  flex-direction: column;
}

header {
  width: 100%;
  background-color: #002b4d;
  color: #fff;
  padding: 20px;
  text-align: center;
  font-size: 2em;
  font-weight: bold;
  position: relative;
  box-sizing: border-box;
}

#clock {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 0.9em;
}

#fullscreen-btn {
  position: absolute;
  top: 15px;
  left: 20px;
  background: #004080;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
}

#warning-box {
  margin: 8px auto;
  padding: 8px 15px;
  width: 80%;
  max-width: 1000px;
  background-color: #800000;
  border-radius: 8px;
  color: white;
  height: 35px;
  line-height: 20px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 1em;
  flex-shrink: 0;
  box-sizing: border-box;
}

.panel {
  margin: 10px auto;
  width: 80%;
  max-width: 1000px;
  background-color: #2c2c2c;
  border-radius: 10px;
  font-size: 1.6em;
  line-height: 1.5em;
  color: #e0e0e0;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}

.panel p {
  margin: 8px 15px;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

#main-panel {
  flex: 4;
  min-height: 300px;
}

#secondary-panel {
  flex: 2;
  padding: 20px;
  overflow-y: auto;
  text-align: left;
  transition: opacity 0.5s ease;
}

#main-panel::before,
#main-panel::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 40px;
  z-index: 5;
  pointer-events: none;
}

#main-panel::before {
  top: 0;
  background: linear-gradient(#2c2c2c, transparent);
}

#main-panel::after {
  bottom: 0;
  background: linear-gradient(transparent, #2c2c2c);
}

#main-scroll {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  padding-top: 15px;
}

#ticker-container {
  width: 100%;
  overflow: hidden;
  border-top: 1px solid #555;
  border-bottom: 1px solid #555;
  background-color: #2a2a2a;
  position: relative;
  height: 2em;
}

#ticker-content {
  display: inline-block;
  white-space: nowrap;
  position: absolute;
  top: 0;
  left: 0;
  font-size: 1.2em;
  line-height: 2em;
}

footer {
  text-align: center;
  color: #aaa;
  padding: 10px;
}

@media (max-width: 768px) {
  .panel,
  #warning-box {
    width: 95%;
  }

  .panel {
    font-size: 1.2em;
  }

  header {
    font-size: 1.4em;
  }
}
</style>
</head>
<body>

<header>
  Southeast Communications 911
  <div id="clock">--:--:--</div>
  <button id="fullscreen-btn">Fullscreen</button>
</header>

<div id="warning-box">Loading Nebraska warnings...</div>

<div id="main-panel" class="panel">
  <div id="main-scroll">Loading main messages...</div>
</div>

<div id="secondary-panel" class="panel">
  Loading announcements...
</div>

<div id="ticker-container">
  <div id="ticker-content">Loading news ticker...</div>
</div>

<footer>Messages update automatically</footer>

<script>
const clock = document.getElementById('clock');
const warningBox = document.getElementById('warning-box');
const mainScroll = document.getElementById('main-scroll');
const secondaryPanel = document.getElementById('secondary-panel');
const tickerContent = document.getElementById('ticker-content');
const fsButton = document.getElementById('fullscreen-btn');

let secondaryMessages = [];
let secondaryIndex = 0;
let scrollTop = 0;
let scrollRunning = false;

let tickerX = 0;
let tickerWidth = 0;
const tickerSpeed = 50;
let lastTime = null;

function updateClock() {
  clock.textContent = new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

function scrollMain() {
  const panelHeight = mainScroll.parentElement.clientHeight;
  const contentHeight = mainScroll.scrollHeight;

  if (contentHeight > panelHeight) {
    scrollTop -= 0.4;

    if (-scrollTop >= contentHeight) {
      scrollTop = panelHeight;
    }

    mainScroll.style.transform = `translateY(${scrollTop}px)`;
  }

  requestAnimationFrame(scrollMain);
}

async function loadMainMessages() {
  try {
    const res = await fetch('messages.json?v=' + Date.now());
    const data = await res.json();

    mainScroll.innerHTML = data.length
      ? data.map(m => `<p>${String(m).replace(/\\n/g,'<br>')}</p>`).join('')
      : '<p>No messages at this time.</p>';

    scrollTop = 0;

    if (!scrollRunning) {
      scrollRunning = true;
      requestAnimationFrame(scrollMain);
    }

  } catch (err) {
    mainScroll.innerHTML = '<p>Unable to load main messages.</p>';
    console.error(err);
  }
}

async function loadSecondaryMessages() {
  try {
    const res = await fetch('announcements.json?v=' + Date.now());
    secondaryMessages = await res.json();
    secondaryIndex = 0;
    showNextSecondary();
  } catch (err) {
    secondaryPanel.textContent = 'Unable to load announcements.';
  }
}

function showNextSecondary() {
  if (!secondaryMessages.length) return;

  secondaryPanel.style.opacity = 0;

  setTimeout(() => {
    secondaryPanel.innerHTML =
      `<div>${secondaryMessages[secondaryIndex]}</div>`;

    secondaryIndex =
      (secondaryIndex + 1) % secondaryMessages.length;

    secondaryPanel.style.opacity = 1;
  }, 500);
}

async function loadNebraskaWarnings() {
  try {
    const res = await fetch(
      'https://api.weather.gov/alerts/active?area=NE'
    );

    const data = await res.json();

    if (data.features && data.features.length) {
      warningBox.textContent =
        data.features
          .map(a => a.properties.event)
          .join(' • ');
    } else {
      warningBox.textContent =
        'No active weather warnings.';
    }

  } catch (err) {
    warningBox.textContent =
      'Unable to load Nebraska warnings.';
  }
}

async function loadTickerNews() {
  try {
    const res = await fetch(
      'https://saurav.tech/NewsAPI/top-headlines/category/general/us.json'
    );

    const data = await res.json();

    let text = 'No news available.';

    if (data.articles && data.articles.length) {
      text = data.articles
        .map(a => a.title)
        .join(' • ');
    }

    tickerContent.textContent = text;

  } catch (err) {
    tickerContent.textContent =
      'Unable to load news ticker.';
  }

  tickerX = tickerContent.parentElement.offsetWidth;
  tickerWidth = tickerContent.offsetWidth;
  lastTime = null;
}

function animateTicker(time) {
  if (!lastTime) lastTime = time;

  const delta = (time - lastTime) / 1000;
  lastTime = time;

  tickerX -= tickerSpeed * delta;

  if (tickerX <= -tickerWidth) {
    tickerX = tickerContent.parentElement.offsetWidth;
  }

  tickerContent.style.transform =
    `translateX(${tickerX}px)`;

  requestAnimationFrame(animateTicker);
}

fsButton.addEventListener('click', () => {
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }
  fsButton.style.display = 'none';
});

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    fsButton.style.display = 'block';
  }
});

loadMainMessages();
loadSecondaryMessages();
loadNebraskaWarnings();
loadTickerNews();

requestAnimationFrame(animateTicker);

setInterval(loadMainMessages, 5000);
setInterval(loadNebraskaWarnings, 300000);
setInterval(loadTickerNews, 60000);
setInterval(showNextSecondary, 10000);
</script>

</body>
</html>
