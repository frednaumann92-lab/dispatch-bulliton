<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Southeast Communications 911</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: Arial, sans-serif;
    background-color: #1c1c1c;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    width: 100%;
    background-color: #002b4d;
    color: #fff;
    padding: 20px;
    text-align: center;
    font-size: 2.2em;
    font-weight: bold;
    position: relative;
    box-sizing: border-box;
  }

  #clock {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 0.8em;
  }

  #fullscreen-btn {
    position: absolute;
    top: 18px;
    left: 20px;
    background: #004080;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.5em;
  }

  /* Main Center Panel */
  #main-panel {
    flex: 1;
    margin: 20px auto;
    width: 90%;
    max-width: 1200px;
    background-color: #2c2c2c;
    border-radius: 10px;
    padding: 25px;
    font-size: 1.8em;
    line-height: 1.6em;
    color: #e0e0e0;
    overflow-y: auto;
    box-sizing: border-box;
    border: 1px solid #444;
  }

  #main-panel p {
    margin-top: 0;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px dashed #444;
  }
  #main-panel p:last-child {
    border-bottom: none;
  }

  /* Simple Scrolling Bottom Ticker */
  #ticker-container {
    width: 100%;
    background-color: #800000; /* Dark Red Alert Color */
    border-top: 2px solid #a00000;
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
    padding: 12px 0;
  }

  #ticker-content {
    display: inline-block;
    padding-left: 100%;
    animation: ticker-scroll 25s linear infinite;
    font-size: 1.5em;
    font-weight: bold;
    color: #fff;
  }

  @keyframes ticker-scroll {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }
</style>
</head>
<body>

<header>
  Southeast Communications 911
  <div id="clock">--:--:--</div>
  <button id="fullscreen-btn">Fullscreen</button>
</header>

<div id="main-panel">Loading dispatch logs/messages...</div>

<div id="ticker-container">
  <div id="ticker-content" id="ticker-text">Loading alert banner...</div>
</div>

<script>
const clock = document.getElementById('clock');
const mainPanel = document.getElementById('main-panel');
const tickerContent = document.getElementById('ticker-content');
const fsButton = document.getElementById('fullscreen-btn');

// 1. Clock functionality
function updateClock() {
  clock.textContent = new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// 2. Load Main Center Messages
async function loadMainMessages() {
  try {
    const res = await fetch('messages.json?v=' + Date.now());
    const data = await res.json();
    
    // Generates a simple paragraph for every line in your JSON file
    mainPanel.innerHTML = data.length 
      ? data.map(msg => `<p>${msg}</p>`).join('')
      : '<p>No active briefings or messages.</p>';
  } catch (err) {
    mainPanel.innerHTML = '<p style="color: #ff6666;">Error loading messages.json. Check file formatting.</p>';
  }
}

// 3. Load Bottom Scrolling Banner
async function loadTickerMessages() {
  try {
    const res = await fetch('ticker.json?v=' + Date.now());
    const data = await res.json();
    
    // Joins all your ticker items together separated by bullet points
    tickerContent.textContent = data.length 
      ? data.join('  •  ') 
      : 'No active ticker alerts.';
  } catch (err) {
    tickerContent.textContent = 'Error loading ticker.json';
  }
}

// 4. Fullscreen Button Control
fsButton.addEventListener('click', () => {
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }
  fsButton.style.display = 'none';
});

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    fsButton.style.display = 'block';
  }
});

// Run updates automatically
loadMainMessages();
loadTickerMessages();

setInterval(loadMainMessages, 5000);     // Check messages.json every 5 seconds
setInterval(loadTickerMessages, 10000);  // Check ticker.json every 10 seconds
</script>

</body>
</html>
